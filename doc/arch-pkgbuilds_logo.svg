<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Frame (AUR Blue) -->
  <rect x="50" y="50" width="1100" height="300" rx="30" fill="none" stroke="#1793d1" stroke-width="4" />

  <!-- Text Block: Specialized for long package names -->
  <g font-family="'JetBrains Mono', monospace" font-weight="bold" text-anchor="middle">

    <!-- 1. Shadow of the Edge -->
    <text x="604" y="244" font-size="125" fill="none" stroke="black" stroke-width="8" letter-spacing="2">arch-PKGBUILDs</text>

    <!-- 2. The Main Floating Edge (AUR Blue Outline) -->
    <text x="600" y="240" font-size="125" fill="none" stroke="#1793d1" stroke-width="8" letter-spacing="2">arch-PKGBUILDs</text>

    <!-- 3. The Recessed Interior (Hollow) -->
    <text x="600" y="240" font-size="125" fill="none" letter-spacing="2">arch-PKGBUILDs</text>

    <!-- Subtitle (Solid White) -->
    <text x="600" y="315" font-size="40" fill="#ffffff" letter-spacing="3">Arch Linux Package Manifests</text>
  </g>
</svg>
